{# The full-screen "Pin delivery location" map, shared by checkout and Edit Profile. #}
{{ map_config|json_script:"map-config" }}

<div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title" hidden>
    <header class="appbar">
        <button type="button" class="icon-btn back" data-picker-close aria-label="{{ picker_back }}"><span class="ms" aria-hidden="true">arrow_back</span></button>
        <h2 class="appbar-title" id="picker-title">Pin delivery location</h2>
    </header>
    <div class="picker-body">
        <div class="picker-map" id="picker-map" aria-label="Map: drag the pin or tap where to deliver"></div>
        <div class="zone" id="zone" aria-live="polite"><span class="ms fill" aria-hidden="true">check_circle</span><p></p></div>
        <div class="picker-controls">
            <button type="button" class="fab-ext" id="locate"><span class="ms" aria-hidden="true">my_location</span>Centre on my location</button>
            <div class="picker-card">
                <p class="picker-coords" id="picker-coords"></p>
                <p class="picker-hint">Tap the map or drag the pin to adjust.</p>
                <button type="button" class="btn btn--amber btn--login" id="picker-confirm">Confirm location</button>
            </div>
        </div>
    </div>
</div>
